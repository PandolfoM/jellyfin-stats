services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jfstats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: jfstats
    ports:
      # Bound to loopback only, not 0.0.0.0: this exists so a host-side
      # process (the dev server run via `pnpm --filter @jfstats/server dev`,
      # `seed`, `backfill`, or a local `psql`) can reach Postgres — the `app`
      # container never uses this, it reaches Postgres over the compose
      # network by service name (see DATABASE_URL below). Loopback-only means
      # this does not additionally expose Postgres to the LAN the way the
      # `app` service's published port intentionally does.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jfstats -d jfstats"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    # Exactly one replica: it runs the startup migration and the in-process
    # scheduler, and neither is safe to run twice against the same database —
    # a second scheduler would double-poll Jellyfin, and two `migrate()` calls
    # at once could race the same schema. The fixed host port below already
    # rejects `docker compose up -d --scale app=2` on this single host, but
    # that is incidental, not the guarantee: it does not hold under Swarm or a
    # reverse-proxy topology where two instances could run without a port
    # clash. Do not scale this service.
    env_file: .env
    environment:
      # The container reaches Postgres by service name over the compose
      # network; .env's DATABASE_URL is the host-facing value used by `tsx`
      # run directly on the host, and would send the container to its own
      # loopback interface.
      DATABASE_URL: postgres://jfstats:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/jfstats
    ports:
      # Both sides use the same value: PORT is what the process binds to
      # (packages/shared/src/env.ts), not a host-only knob, so hardcoding the
      # container side would let the published port dial a container that is
      # not listening on it.
      - "${PORT:-3000}:${PORT:-3000}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:${PORT:-3000}/api/health || exit 1",
        ]
      start_period: 30s
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
